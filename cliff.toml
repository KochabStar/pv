[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/KochabStar/pv/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
  - {{ commit.message | split(pat="\\n") | first | trim }}\
    {% if commit.remote.username %} (@{{ commit.remote.username }}){% endif %}\
    {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/KochabStar/pv/pull/{{ commit.remote.pr_number }}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = '^chore\(release\): prepare for', skip = true },
  { message = '^chore: (release|Release)', skip = true },
  { message = '^Release', skip = true },
  { message = '^feat', group = "🚀 Features" },
  { message = '^fix', group = "🐛 Bug Fixes" },
  { message = '^refactor', group = "🚜 Refactor" },
  { message = '^doc', group = "📚 Documentation" },
  { message = '^perf', group = "⚡ Performance" },
  { message = '^test', group = "🧪 Testing" },
  { message = '^chore', group = "🔧 Chores" },
  { message = '^style', group = "🎨 Styling" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "KochabStar"
repo = "pv"
