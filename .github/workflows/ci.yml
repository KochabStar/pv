name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: pv

jobs:
  # ── 测试 (Linux, 单平台即可) ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # ── 构建 + 打包 (全平台矩阵) ─────────────────────────────────
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive: tar.gz


    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir $dir
          cp "target/${{ matrix.target }}/release/pv${{ matrix.ext }}" "$dir/"
          cp "target/${{ matrix.target }}/release/pv-shim${{ matrix.ext }}" "$dir/"
          cp README.md "$dir/" -ErrorAction SilentlyContinue
          cp LICENSE "$dir/" -ErrorAction SilentlyContinue
          cp scripts/install.ps1 "$dir/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          dir="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/pv" "$dir/"
          cp "target/${{ matrix.target }}/release/pv-shim" "$dir/"
          cp README.md LICENSE "$dir/" 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive }}

  # ── GitHub Release (tag 推送或网页发布 Release 时) ─────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: pv-*
          merge-multiple: true
      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: artifacts/**/*
          body_path: CHANGELOG.md
          generate_release_notes: true
          fail_on_unmatched_files: true
