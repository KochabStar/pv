name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.5.6
        with:
          advanced-security: false
          min-severity: high
