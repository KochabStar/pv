[package]
name = "pv"
version = "0.1.0"
edition = "2021"
description = "Cross-platform package and version manager"
license = "MIT"

[lib]
name = "pv"
path = "src/lib.rs"

[[bin]]
name = "pv"
path = "src/main.rs"

[[bin]]
name = "pv-shim"
path = "src/bin/shim.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
flate2 = "1.0"
futures-util = "0.3"
indicatif = "0.17"
junction = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
toml = "0.8"
unrar-ng = "0.7"
walkdir = "2.5"
zip = "2.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
tiny_http = "0.12"
